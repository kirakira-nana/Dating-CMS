[language]
; The prefix of the language: Japanese = ja
lang = ja

; ltr = Left to right language (日本語, English, ...) | rtl = right to left language (Arabic, Hebrew, ...).
dir = ltr

; Language for encoding: UTF-8 generally still works.
charset = "utf-8"

[language.information]
name = 日本語
author = "kirakira-nana"
email = "seniorninja652@gmail.com"
website = "https://github.com/kirakira-nana"

[language.application]
; Timezone for the web app
timezone = "Asia/Tokyo"

; Date format displays on the web app
date_time_format = "Y-m-d H:i:s"
date_format = "Y-m-d"
textual_date_format = "Y年n月j日"
time_format = "H:i:s"
